[project]
name = "ha-iletcomfort"
version = "0.0.0"
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
dev = [
  "mypy",
  "pytest-homeassistant-custom-component>=0.13.375",
  "ruff",
  "types-requests",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
# Catch correctness bugs (pyflakes + fatal pycodestyle) without noisy churn.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
